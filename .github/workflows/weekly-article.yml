name: Weekly SEO article

on:
  schedule:
    - cron: '0 9 * * 1' # каждый понедельник 09:00 UTC
  workflow_dispatch: {} # плюс ручной запуск из вкладки Actions

jobs:
  write:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install anthropic google-auth
      - name: Generate article
        run: python3 scripts/write_article.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Темы берутся из реального спроса. Без секрета или при ошибке API
          # скрипт откатывается на придуманную тему, а не падает.
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
      - name: Rebuild landing
        run: python3 scripts/landing/build.py
      - name: Commit new article
        run: |
          git config user.name "bl3ndd"
          git config user.email "56427966+bl3ndd@users.noreply.github.com"
          git add content/blog site
          git diff --staged --quiet || git commit -m "content: еженедельная SEO-статья"
          git push

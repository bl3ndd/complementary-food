name: Prikorm
options:
  bundleIdPrefix: com.pudding
  developmentLanguage: ru          # язык-исходник; переводы — в Localizable.xcstrings
  # 14 языков UI (ru-источник + 13 переводов). Должны быть в knownRegions, иначе
  # компилятор строкового каталога не положит их .lproj в бандл.
  knownRegions:
    - ru
    - en
    - de
    - fr
    - es
    - it
    - pt-BR
    - pl
    - tr
    - uk
    - nl
    - ja
    - ko
    - zh-Hans
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "3"
targets:
  Prikorm:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    # Info.plist явным файлом, а не GENERATE_INFOPLIST_FILE: ключ UIBackgroundModes
    # через INFOPLIST_KEY_* не доезжал до бандла (проверено на архиве), а без него
    # CloudKit не получает тихие пуши и синк подтягивается только при запуске.
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Pudding
        # Версии — из build settings, иначе XcodeGen подставляет свои дефолты
        # («1.0» / «1») и в стор уезжает не тот номер сборки.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [remote-notification]
        # Экран запуска в цвете приложения: белая вспышка перед тёмной темой
        # выглядит как чужой экран (и бьёт по глазам ночью).
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]

    # iCloud-синхрон (SwiftData + CloudKit, приватная база пользователя).
    # Файл entitlements генерируется отсюда — руками в Xcode галки не ставить,
    # следующий `xcodegen generate` их сотрёт.
    entitlements:
      path: Prikorm.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.pudding.app
        com.apple.developer.icloud-services:
          - CloudKit
        # Синк ездит на тихих пушах. В Release подменяется на production —
        # см. CODE_SIGN_ENTITLEMENTS ниже.
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pudding.app
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: A89ST3SFXS
      configs:
        # У релизного билда aps-environment обязан быть production, иначе App Store
        # отбивает загрузку. Отдельный файл — потому что XcodeGen генерит только один.
        Release:
          CODE_SIGN_ENTITLEMENTS: Prikorm.release.entitlements
  PrikormTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Prikorm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pudding.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: A89ST3SFXS
  PrikormUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Prikorm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pudding.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Prikorm
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: A89ST3SFXS
schemes:
  Prikorm:
    build:
      targets:
        Prikorm: all
    test:
      targets:
        - PrikormTests
        - PrikormUITests

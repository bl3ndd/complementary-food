name: Prikorm
options:
  bundleIdPrefix: com.pudding
  developmentLanguage: ru          # язык-исходник; переводы — в Localizable.xcstrings
  # 14 языков UI (ru-источник + 13 переводов). Должны быть в knownRegions, иначе
  # компилятор строкового каталога не положит их .lproj в бандл.
  knownRegions:
    - ru
    - en
    - de
    - fr
    - es
    - it
    - pt-BR
    - pl
    - tr
    - uk
    - nl
    - ja
    - ko
    - zh-Hans
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    # Альтернативные иконки (Pro). Имена обязаны совпадать с AppIconManager.names.
    ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIconMarshmallow AppIconMatcha AppIconLavender AppIconPeach AppIconHoney AppIconBlueberry
    ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
    CURRENT_PROJECT_VERSION: "5"
targets:
  Prikorm:
    type: application
    platform: iOS
    dependencies:
      - target: PuddingWidget
        embed: true
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    # Info.plist явным файлом, а не GENERATE_INFOPLIST_FILE: ключ UIBackgroundModes
    # через INFOPLIST_KEY_* не доезжал до бандла (проверено на архиве), а без него
    # CloudKit не получает тихие пуши и синк подтягивается только при запуске.
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Pudding
        # Версии — из build settings, иначе XcodeGen подставляет свои дефолты
        # («1.0» / «1») и в стор уезжает не тот номер сборки.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        # Без этого ключа iOS держит весь апп на 60 Гц: на ProMotion-айфонах
        # максимальная частота кадров по умолчанию 60, и никакая оптимизация
        # рендера выше не поднимет.
        CADisableMinimumFrameDurationOnPhone: true
        UIBackgroundModes: [remote-notification]
        # Экран запуска в цвете приложения: белая вспышка перед тёмной темой
        # выглядит как чужой экран (и бьёт по глазам ночью).
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]

    # iCloud-синхрон (SwiftData + CloudKit, приватная база пользователя).
    # Файлы entitlements — РУЧНЫЕ (`Prikorm.entitlements` для Debug,
    # `Prikorm.release.entitlements` для Release). Блока `entitlements:` здесь быть
    # не должно: XcodeGen прописывает из него CODE_SIGN_ENTITLEMENTS сразу в оба
    # конфига и молча затирает переопределение для Release — релизный архив уезжал
    # с `aps-environment: development`, и экспорт в App Store падал на профиле.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pudding.app
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: A89ST3SFXS
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Prikorm.entitlements
        # У релизного билда aps-environment обязан быть production, а контейнер
        # iCloud — Production, иначе App Store отбивает загрузку.
        Release:
          CODE_SIGN_ENTITLEMENTS: Prikorm.release.entitlements
  PuddingWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: PuddingWidget
      # Снимок общий с приложением: расширение не открывает SwiftData и не знает
      # про CloudKit, ему нужен только этот файл.
      - path: Sources/App/WidgetSnapshot.swift
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pudding.app.widget
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: A89ST3SFXS
        CODE_SIGN_ENTITLEMENTS: PuddingWidget.entitlements
        SKIP_INSTALL: YES
    # Info.plist явным файлом, а не GENERATE_INFOPLIST_FILE: NSExtension через
    # INFOPLIST_KEY_* до бандла не доезжает, и installd отказывается ставить
    # приложение — «appex does not define an NSExtension dictionary». Та же
    # болезнь, что была с UIBackgroundModes у основного таргета.
    info:
      path: PuddingWidget/Info.plist
      properties:
        CFBundleDisplayName: Pudding
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  PrikormTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Prikorm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pudding.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: A89ST3SFXS
  PrikormUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Prikorm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pudding.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Prikorm
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: A89ST3SFXS
schemes:
  Prikorm:
    build:
      targets:
        Prikorm: all
    test:
      targets:
        - PrikormTests
        - PrikormUITests
